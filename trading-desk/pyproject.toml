[project]
name = "trading-desk"
version = "0.1.0"
description = "Agent-assisted systematic trading desk on Hyperliquid. Phase 1: deterministic core, no LLM."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "hyperliquid-python-sdk>=0.10",
    "eth-account>=0.10",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
desk = "desk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["desk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

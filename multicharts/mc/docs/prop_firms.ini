# Regole di valutazione delle prop firm, lette da prop_sim.py.
#
# Una sezione per conto. Solo regole dell'EVAL: il funded ha regole sue (payout,
# consistency, inattivita') e non entra qui.
# Ogni valore ha una fonte. Se non e' verificato, si scrive accanto da dove viene;
# un valore che non si conosce si lascia "none", non si stima.
#
# Campi:
#   nome             come appare nei report
#   conto            capitale iniziale ($)
#   target           profitto da raggiungere ($)
#   mll              max loss limit ($)
#   trailing         eod = il limite sale solo con la chiusura di giornata
#                    (intraday non e' ancora supportato da prop_sim)
#   lock_sopra_conto il limite smette di salire a conto + questo valore ($)
#   dll              daily loss limit dell'eval ($): chiude la giornata, non il conto; 0 = nessuno
#   giorni_max       scadenza in giorni di trading; 0 = nessuna scadenza
#   costo_tentativo  prezzo di un'eval ($); none = non verificato
#   attivazione      costo una tantum per attivare il funded dopo il pass ($); none = non verificato
#   comm_micro_rt    costo effettivo per micro andata e ritorno, su MNQ ($)
#   max_micro        limite di contratti in micro; none = non verificato
#   fonte            da dove vengono i numeri
#   verificato       data dell'ultimo controllo

[lucidflex_50k]
nome             = LucidFlex 50k
conto            = 50000
target           = 3000
mll              = 2000
trailing         = eod
lock_sopra_conto = 100
# non citato nei transcript: da verificare
dll              = 0
giorni_max       = 0
costo_tentativo  = 100
attivazione      = none
comm_micro_rt    = 1.50
max_micro        = none
fonte            = transcript Live 001-005; nessuna consistency in eval, flat EOD obbligatorio
verificato       = 2026-10-15

[apex_50k_eod]
nome             = Apex 50K EOD (4.0)
conto            = 50000
target           = 3000
mll              = 2000
trailing         = eod
# il blocco a +$100 viene dal Colab del corso, il sito non lo riporta in questa pagina
lock_sopra_conto = 100
# fisso nell'eval; al limite Apex liquida e ferma la sessione, il conto resta attivo
dll              = 1000
# "Access Period 30 Days" = durata dell'eval (confermato da Mario il 25/10/2026):
# 30 giorni di calendario = ~21 di trading (il Colab usa 21).
# prop_sim conta i giorni CON trade, il calendario Apex no: leggermente ottimista
giorni_max       = 21
# prezzo in offerta al 25/10/2026; cambia spesso, da ricontrollare prima di comprare
costo_tentativo  = 59
attivazione      = 129
# Apex non ha un costo per micro: si usa lo stesso di Lucid
comm_micro_rt    = 1.50
max_micro        = 60
fonte            = sito Apex (pagina 50K EOD TRAIL e Daily Loss Limit Explained), 24/10/2026
verificato       = 2026-10-25
# Funded (PA), per quando simuleremo il funded: max 40 micro con scaling (Level 1:
# 2 mini e DLL $1.000 fino a +$1.499), MLL $2.000 EOD, consistency 50%, payout ogni
# 5 giorni di trading, al massimo 6 richieste, split 100%, regola di inattivita'.

# Regole di valutazione delle prop firm, lette da prop_sim.py.
#
# Una sezione per conto. Solo regole dell'EVAL: il funded ha regole sue (payout,
# consistency, inattivita') e non entra qui.
# Ogni valore ha una fonte. Se non e' verificato, si scrive accanto da dove viene;
# un valore che non si conosce si lascia "none", non si stima.
#
# Campi:
#   nome             come appare nei report
#   conto            capitale iniziale ($)
#   target           profitto da raggiungere ($)
#   mll              max loss limit ($)
#   trailing         eod = il limite sale solo con la chiusura di giornata
#                    (intraday non e' ancora supportato da prop_sim)
#   lock_sopra_conto il limite smette di salire a conto + questo valore ($)
#   giorni_max       scadenza in giorni di trading; 0 = nessuna scadenza
#   costo_tentativo  prezzo di un'eval ($); none = non verificato
#   comm_micro_rt    costo effettivo per micro andata e ritorno, su MNQ ($)
#   max_micro        limite di contratti in micro; none = non verificato
#   fonte            da dove vengono i numeri
#   verificato       data dell'ultimo controllo

[lucidflex_50k]
nome             = LucidFlex 50k
conto            = 50000
target           = 3000
mll              = 2000
trailing         = eod
lock_sopra_conto = 100
giorni_max       = 0
costo_tentativo  = 100
comm_micro_rt    = 1.50
max_micro        = none
fonte            = transcript Live 001-005; nessuna consistency in eval, flat EOD obbligatorio
verificato       = 2026-10-15

[apex_50k_eod]
nome             = Apex 50K EOD (4.0)
conto            = 50000
target           = 3000
# il Colab: "4.0 rules suggest 2_000"; il funded del Colab parla di $2.500, da verificare
mll              = 2000
trailing         = eod
lock_sopra_conto = 100
# il Colab conta 21 giorni FERIALI, anche quelli senza trade; prop_sim conta i giorni con trade
giorni_max       = 21
# il Colab mette $100 con "EDIT to your real price"
costo_tentativo  = none
# il Colab non ha un costo per micro: lo calcola sul NQ. Qui si usa lo stesso di Lucid
comm_micro_rt    = 1.50
max_micro        = 60
fonte            = PropFirm_MonteCarlo_Apex50K_1708.ipynb (Live 003), da verificare sul sito Apex
verificato       = none

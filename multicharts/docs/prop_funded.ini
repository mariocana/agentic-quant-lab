# Regole del conto FUNDED, lette da funded_sim.py. Le regole dell'eval restano in prop_firms.ini.
# Come li': ogni valore ha una fonte, e quello che non si conosce resta "none".
#
# Campi:
#   conto, mll       come nell'eval; il trailing e' a fine giornata
#   lock_sopra_conto l'MLL si ferma a conto + questo valore...
#   lock_oltre       ...quando il saldo di chiusura supera conto + questo valore
#   dll              daily loss limit soft ($): chiude la giornata, non il conto; 0 = nessuno
#   giorni_qual      giorni con profitto >= giorno_min che servono in ogni ciclo di payout
#   giorno_min       profitto minimo di un giorno perche' conti ($)
#   payout_min       richiesta minima ($)
#   payout_max       richiesta massima ($), non cresce con i payout
#   payout_quota     quota massima del profitto (saldo - conto) che si puo' chiedere
#   split            quota che resta al trader
#   payout_n         payout massimi sul conto; poi il conto passa a live
#   consistency      0 = nessuna
#   scaling          gradini di size per profitto; none = non verificato

[lucidflex_50k_funded]
nome             = LucidFlex 50k funded
conto            = 50000
mll              = 2000
# "Once your account exceeds the Initial Trail Balance [$52.100], the MLL locks" a $50.100
lock_sopra_conto = 100
lock_oltre       = 2100
# il nostro conto e' la versione con DLL; con il DLL acceso i payout sono "on demand"
dll              = 1200
# "at least $150 profit on 5 separate days in the payout cycle"; si azzera a ogni payout approvato
giorni_qual      = 5
giorno_min       = 150
payout_min       = 500
# "50% of profit, up to $2,000 per request"; i massimi "do not scale up with more payouts"
payout_max       = 2000
payout_quota     = 0.50
split            = 0.90
# "Up to 5, after which the account is moved live"
payout_n         = 5
consistency      = 0
# la pagina dice "scaling plan, max 4 mini or 40 micros" senza i gradini: con 3 micro si assume
# di stare dentro il primo gradino
scaling          = none
fonte            = support.lucidtrading.com: LucidFlex Payouts (12945796), LucidFlex Funded Account (12945795), LucidFlex Drawdown (12945815)
verificato       = 2026-11-12

# NON SCRITTO nelle pagine, assunto da funded_sim.py (da chiedere a Lucid):
#   - il payout richiesto scende dal saldo;
#   - alla richiesta l'MLL va a $50.100 ("your MLL automatically adjusts to the Locked MLL
#     Balance"): scritto; che resti li' anche se il saldo era sotto $52.100: assunto;
#   - "profit" del 50% = saldo - conto;
#   - il valore del conto dopo il passaggio a live: non modellato, conta zero.

# FTMO: CFD su MT5. I segnali restano su MultiCharts e arrivano a MT5 con bridge/ (v2 a stato,
# bridge/SPEC.md): in prova su challenge free, mai compilato al 10/11/2026.
# Regole e prezzi dagli screenshot di Mario del 10/11/2026 (pagina FTMO, prezzi in EUR),
# convertiti a 1,111 $/EUR (cambio dell'addebito MultiCharts del 29/10: $99 = 89,10 EUR).
# Simulati in micro equivalenti ai futures: il CFD (US100, XAUUSD) si dimensiona in lotti
# per avere lo stesso $ a punto. Costi CFD (spread, swap) non misurati: si usa la stima Lucid.
# Perdita massima (ftmo.com/en/trading-objectives, 12/11/2026): nel 2-Step e' statica al 10%; nell'1-Step
# e' TRAILING a fine giornata, 10% sotto il saldo di chiusura piu' alto, senza un tetto dichiarato
# (lock_sopra_conto alto = non si ferma). Fino al 12/11 qui l'1-Step era statico: pass rate sovrastimato.
# Perdita giornaliera: sull'equity, dal saldo di chiusura del giorno prima, 3% (1-Step) o 5% (2-Step)
# del capitale iniziale. Consistency 1-Step: giorno migliore <= 50% del profitto totale.
# Remunerazione 90% sul funded, non modellata.

# Regole di valutazione delle prop firm, lette da prop_sim.py.
#
# Una sezione per conto. Solo regole dell'EVAL: il funded ha regole sue (payout,
# consistency, inattivita') e non entra qui.
# Ogni valore ha una fonte. Se non e' verificato, si scrive accanto da dove viene;
# un valore che non si conosce si lascia "none", non si stima.
#
# Campi:
#   nome             come appare nei report
#   conto            capitale iniziale ($)
#   target           profitto da raggiungere ($)
#   mll              max loss limit ($)
#   trailing         eod = il limite sale solo con la chiusura di giornata
#                    intraday = sale anche sul massimo toccato dentro il trade (prop_sim assume
#                    prima il massimo, poi il minimo: il caso prudente)
#   lock_sopra_conto il limite smette di salire a conto + questo valore ($)
#   consistency      giornata migliore / profitto al target, massimo; 0 = nessuna regola
#   dll              daily loss limit dell'eval ($): chiude la giornata, non il conto; 0 = nessuno
#   giorni_max       scadenza in giorni di trading; 0 = nessuna scadenza
#   costo_tentativo  prezzo di un'eval ($); none = non verificato
#   attivazione      costo una tantum per attivare il funded dopo il pass ($); none = non verificato
#   comm_micro_rt    costo effettivo per micro andata e ritorno, su MNQ ($): commissione + 1 tick
#   comm_<simbolo>_rt lo stesso per altri micro (comm_mgc_rt: $0,80 x 2 + 1 tick da $1)
#   automazione      si / no / none: per noi e' un requisito, senza non si puo' tradare
#   max_micro        limite di contratti in micro; none = non verificato
#   fonte            da dove vengono i numeri
#   verificato       data dell'ultimo controllo

# LucidFlex: DLL e consistency si scelgono all'acquisto e cambiano il prezzo.
# Prezzi dalla pagina d'acquisto (screenshot di Mario, 25/10/2026, con coupon; listino $115).
# Il reset costa piu' di un'eval nuova nella versione base: per tentativo si conta l'eval.
# Il DLL e' "soft": se scatta, la giornata finisce, il conto resta vivo.

[lucidflex_50k]
nome             = LucidFlex 50k DLL 40%
consistency      = 0.40
dll              = 1200
# la versione piu' economica; $69 fino a fine ottobre, $80 dal 04/11/2026 (Mario); reset $80
costo_tentativo  = 80
fonte            = support.lucidtrading.com (collezione LucidFlex) + pagina d'acquisto, 25/10/2026
conto            = 50000
target           = 3000
mll              = 2000
trailing         = eod
# MLL bloccato a $50.100 quando il saldo supera $52.100 (pagina Drawdown)
lock_sopra_conto = 100
giorni_max       = 0
# "No activation fees to upgrade to funded account"
attivazione      = 0
comm_micro_rt    = 1.50
comm_mgc_rt      = 2.60
# permessa, verificato il 30/09/2026
automazione      = si
max_micro        = 40
verificato       = 2026-10-25


# Il perimetro del desk di ricerca (docs/desk_ricerca.md).
#
# Lo leggono gli agenti, per sapere cosa cercare e cosa scartare, e il codice, che rifiuta
# quello che sta fuori: `factory idea` non registra un'idea su un orizzonte spento o su un
# mercato senza dati, `factory measure` non va oltre il tetto mensile.
#
# Si cambia con un commit. Un perimetro cambiato vale per le idee nuove: quelle gia nel
# registro restano giudicate con il perimetro del loro giorno.

orizzonti:
  intraday:
    attivo: true
    cosa: "entra ed esce nella stessa sessione"
    flat_a_fine_giornata: true
    segnali_al_giorno_min: 1        # sotto, la frequenza non regge il conto (cosa_uccide_le_strategie.md)
    misura: motore                  # multicharts/motore, barre da 1 minuto
  daily:
    attivo: false
    cosa: "decide una volta al giorno, tiene da uno a pochi giorni, anche overnight"
    flat_a_fine_giornata: false
    segnali_al_giorno_min: 0
    misura: null                    # non c'e ancora: servono barre giornaliere e un motore che le legga
  swing:
    attivo: false
    cosa: "tiene da giorni a settimane"
    flat_a_fine_giornata: false
    segnali_al_giorno_min: 0
    misura: null

# dati: true = lo storico a 1 minuto e in quantlake/data/multicharts e il motore lo legge.
mercati:
  NQ: {dati: true}
  ES: {dati: true}
  GC: {dati: false}
  CL: {dati: false}
  BTC: {dati: false}

misura:
  periodo: ["2020-01-01", "2024-12-31"]     # solo in-sample: il comando della misura non ne accetta altri
  errori_standard_min: 3.0                  # eccesso / errore standard
  dollari_al_giorno_per_micro_min: 10.0
  idee_al_mese_max: 8                       # idee nuove che arrivano alla misura in un mese, dalle due porte insieme

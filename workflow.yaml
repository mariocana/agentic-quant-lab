# QuantLake — data pipeline manifest.
#
# One source of truth for the bronze → silver → gold DAG. Each table declares
# where its rows come from (`from`) and which transforms were applied. The
# dashboard renders this as a workflow graph so students can see the whole
# pipeline at a glance.
#
# Conventions:
#   - `from` is a list of upstream table keys in the form "<layer>/<name>"
#   - `transforms` is a list of short human-readable steps (course material)
#   - Edit this file whenever you add/change a table; no other wiring needed

sources:
  binance:
    type: exchange (crypto spot)
    modes: [websocket, rest, bulk]
    docs: https://binance-docs.github.io/apidocs/spot/
  dukascopy:
    type: FX / commodity / index datafeed (spot-like)
    modes: [rest-bulk]
    docs: https://www.dukascopy.com/swiss/english/marketwatch/historical/
  capitalcom:
    type: CFD broker (FX, indices, commodities)
    modes: [websocket, rest]
    docs: https://open-api.capital.com/
  fred:
    type: macro time series (Federal Reserve)
    modes: [rest]
    docs: https://fred.stlouisfed.org/docs/api/fred/
  dune:
    type: on-chain analytics
    modes: [rest]
    docs: https://dune.com/docs/api/
  owlracle:
    type: ETH gas (current snapshot, free) + history (paid)
    modes: [rest]
    docs: https://owlracle.info/docs
  open_meteo:
    type: weather (historical reanalysis + forecast)
    modes: [rest]
    docs: https://open-meteo.com/en/docs
  usda_nass:
    type: US agricultural statistics (planted acres, yields)
    modes: [rest]
    docs: https://quickstats.nass.usda.gov/api

  cboe:
    type: volatility indices (daily) + index option chains (15-min delayed snapshot)
    modes: [rest]
    docs: https://www.cboe.com/us/options/market_statistics/
  squeezemetrics:
    type: SPX DIX / GEX daily (free CSV)
    modes: [rest]
    docs: https://squeezemetrics.com/monitor/dix
  multicharts:
    type: futures 1m bars exported by the ExportBars indicator (MultiCharts in Parallels VM)
    modes: [file]
    docs: data/multicharts/<symbol>_1min.csv
  planetary_computer:
    type: Sentinel-2 L2A imagery via STAC (10 m, ~5-day revisit, free, no auth)
    modes: [rest]
    docs: https://planetarycomputer.microsoft.com/dataset/sentinel-2-l2a
  usda_cdl:
    type: USDA Cropland Data Layer, annual national crop raster (30 m)
    modes: [rest-bulk]
    docs: https://www.nass.usda.gov/Research_and_Science/Cropland/Release/
  cftc:
    type: Commitments of Traders, legacy futures only (weekly, free Socrata API)
    modes: [rest]
    docs: https://publicreporting.cftc.gov/resource/6dca-aqww.json
  manual:
    type: hand-maintained reference data (exchange contract specs)
    modes: [code]
    docs: src/quantlake/reference/instruments.py

bronze:
  binance_spot_ohlcv:
    source: binance
    grain: 1m
    partition: [symbol, year, month]
    notes: raw 1m OHLCV bars, idempotent via Delta merge on (symbol, timestamp)

  capitalcom_ohlcv:
    source: capitalcom
    grain: 1m
    partition: [symbol, year, month]
    notes: raw 1m OHLCV from Capital.com (mid price + spreads)

  dukascopy_ohlcv:
    source: dukascopy
    grain: 1m
    partition: [symbol, year, month]
    notes: raw 1m OHLCV from Dukascopy .bi5 daily files (bid + ask → mid)

  fred:
    source: fred
    grain: series-dependent (daily / monthly)
    partition: [symbol, year, month]
    notes: |
      macro observations, one row per release. Timestamps stamped at the
      actual release time in US Eastern (DST-aware), converted to UTC.
      symbol = FRED series id (e.g. T10Y2Y, DGS10).

  dune_ethereum:
    source: dune
    grain: 1h
    partition: [symbol, year, month]
    notes: ETH gas OHLC in gwei, pulled from a saved Dune query

  owlracle_eth_gas:
    source: owlracle
    grain: per-minute snapshot
    partition: [symbol, year, month]
    notes: |
      one row per /gas snapshot (free endpoint). Resampled to 1h OHLC
      by the live script when each hour closes. No /history calls —
      that endpoint is paid.

  open_meteo:
    source: open_meteo
    grain: 1d
    partition: [symbol, year, month]
    notes: |
      daily temp_max / temp_min / precip / wind_speed_max per location.
      symbol = US state code for the wheat-stress pipeline (KS, OK, TX…).
      Historical via /archive (ERA5, 1940→); live via /forecast.

  usda_nass_planted:
    source: usda_nass
    grain: 1y
    partition: [symbol, year, month]
    notes: |
      annual planted acres per (commodity, class, state). One row per
      state per year, timestamped at the approximate NASS release
      date so downstream joins respect publication vintage.
      symbol = f"{commodity}_{class}_{state}" (e.g. WHEAT_WINTER_KS).

  cboe_index_daily:
    source: cboe
    grain: 1d
    partition: [symbol, year, month]
    notes: VIX, VIX9D, VIX1D, VIX3M daily OHLC, stamped 16:15 ET (no look-ahead)

  cboe_option_chain:
    source: cboe
    grain: snapshot (launchd, fixed times)
    partition: [symbol, year, month]
    notes: |
      SPX/SPXW chain, expiries <= 90d, strikes +-20% of spot. One timestamp
      per snapshot (download time UTC). CBOE serves only the current chain:
      this table IS our option history. Basis for GEX levels and EM.

  squeezemetrics:
    source: squeezemetrics
    grain: 1d
    partition: [symbol, year, month]
    notes: SPX close, DIX, GEX since 2011, stamped 18:00 ET

  multicharts_ohlcv:
    source: multicharts
    grain: 1m
    partition: [symbol, year, month]
    notes: ES / NQ 1m continuous (@ES unadjusted, 24h), with upticks/downticks for approximate delta

  sentinel2_ndvi:
    source: planetary_computer
    grain: per acquisition date (~5 days, cloud-filtered)
    partition: [symbol, year, month]
    notes: |
      symbol = AOI id (applications/symbols.py NDVI_AOIS). NDVI mean/std on
      the crop pixels only: USDA CDL mask (harvest-year CDL, previous year if
      unpublished) reprojected onto the S2 grid and eroded 3 px. Reflectances
      harmonized across ESA baseline 04.00 (+1000 offset since 2022-01-25);
      SCL no-data/cloud/shadow/snow masked. Stamped acquisition + 1 day.
      CDL rasters cached under data/bronze/usda_cdl (national + per-AOI clips).

  nass_county_yield:
    source: usda_nass
    grain: 1y
    partition: [symbol, year, month]
    notes: county yield bu/acre, symbol = STATE_COUNTY, stamped Mar 1 of crop_year + 1 (conservative)

  nass_crop_progress:
    source: usda_nass
    grain: 1w
    partition: [symbol, year, month]
    notes: "% of crop per stage, symbol = STATE_STAGE, stamped Monday 16:00 ET after week_ending"

  cftc_cot:
    source: cftc
    grain: 1w
    partition: [symbol]
    notes: |
      plain Delta append (rows strictly after last_bronze_ts), not merge:
      monthly partitions would hold ~4 rows each and make merges crawl.
      open interest + non-commercial / commercial / non-reportable long &
      short (+ nc spreading) for 32 contracts (FX, crypto, index, rates,
      commodities), history since 1986. Positions are as of Tuesday
      (report_date) but stamped at the Friday 15:30 ET release, so joins
      never see a report before it was public.
      symbol = canonical ticker (EUR, GC, ES…), mapping in applications/symbols.py.

silver:
  binance_spot_ohlcv:
    from: [bronze/binance_spot_ohlcv]
    transforms:
      - align_to_minute — truncate open time to the minute (archives 2017-12 → 2018-02 are shifted by seconds), keep the larger-volume row on collision
      - replace inf / -inf with NaN on Float64 columns
      - replace null with NaN on Float64 columns
      - invalidate bars where high < low or low < 0
      - invalidate negative volumes

  multicharts_ohlcv:
    from: [bronze/multicharts_ohlcv]
    transforms:
      - incremental copy of bronze bars newer than the last silver bar (historical/multicharts.py)
      - same align_to_minute + clean_ohlcv rules as binance_spot_ohlcv

  fred:
    from: [bronze/fred]
    transforms:
      - replace inf / -inf with NaN
      - null → NaN on value column

  macro_ohlcv:
    from: [bronze/dukascopy_ohlcv, bronze/capitalcom_ohlcv]
    transforms:
      - compute offset = median(capital_close - dukascopy_close) on 1m overlap
      - shift dukascopy prices by +offset so the timeline sits on Capital's scale
      - project to canonical schema (drops volume — incompatible units across sources)
      - Delta merge on (symbol, timestamp); Capital takes the recent tail, Dukascopy primes the historical
      - offsets persisted to data/macro_offsets.json

  eth_gas:
    from: [bronze/dune_ethereum, bronze/owlracle_eth_gas]
    transforms:
      - Dune (historical) writes 1h OHLC directly
      - Owlracle (live) snapshots resampled into 1h OHLC at each hour boundary
      - truncate timestamps to 1h before upsert (hour-aligned keys)
      - Delta merge on (symbol, timestamp)

  crop_weather:
    from: [bronze/open_meteo]
    transforms:
      - per-state 30d + 90d rolling precipitation sums
      - climatology = per-state, per-day-of-year mean of precip_90d
      - precip_anomaly_90d = (precip_90d - climatology) / climatology
      - stress = -precip_anomaly_90d (drier → higher stress)

  usda_nass_planted:
    from: [bronze/usda_nass_planted]
    transforms:
      - passthrough (no OHLCV cleaning) — scalar annual values

  sentinel2_ndvi_anomaly:
    from: [bronze/sentinel2_ndvi]
    transforms:
      - drop dates with valid_frac < 0.5 (AOI cloudy even if the scene passed)
      - prior seasons interpolated on a daily day-of-season grid (Sept 1 = 0)
      - per observation - baseline mean/std over PRIOR seasons only, anomaly, anomaly_z
      - current season never interpolated (no look-ahead); full rebuild, one overwrite by symbol

  cftc_cot:
    from: [bronze/cftc_cot]
    transforms:
      - full rebuild from bronze each run, one overwrite partitioned by symbol
      - drop reports missing open interest or non-commercial long/short
      - dedupe on (symbol, report_date)
      - nc_net / comm_net / nonrept_net = long - short per trader group
      - nc_net_pct_oi = 100 * nc_net / open_interest (null when OI <= 0)

gold:
  multicharts_ohlcv/1m:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), no features (historical/ohlcv_gold.py)
      - resample 1m → 1m; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  multicharts_ohlcv/5m:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), no features (historical/ohlcv_gold.py)
      - resample 1m → 5m; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  multicharts_ohlcv/15m:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), no features (historical/ohlcv_gold.py)
      - resample 1m → 15m; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  multicharts_ohlcv/1h:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), no features (historical/ohlcv_gold.py)
      - resample 1m → 1h; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  multicharts_ohlcv/4h:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), no features (historical/ohlcv_gold.py)
      - resample 1m → 4h; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  multicharts_ohlcv/1d:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), no features (historical/ohlcv_gold.py)
      - resample 1m → 1d; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  multicharts_ohlcv/4h_cme:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), windows anchored to the CME day (17:00 America/Chicago, DST-aware)
      - timestamp = window open in UTC; 1d_cme = one Globex session (Sun/Mon-Thu 17:00 → 16:00 next day)
      - only windows fully covered by silver; never vacuumed

  multicharts_ohlcv/1d_cme:
    from: [silver/multicharts_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (ES, NQ), windows anchored to the CME day (17:00 America/Chicago, DST-aware)
      - timestamp = window open in UTC; 1d_cme = one Globex session (Sun/Mon-Thu 17:00 → 16:00 next day)
      - only windows fully covered by silver; never vacuumed

  binance_spot_ohlcv/1m:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (every symbol in silver), no features (historical/ohlcv_gold.py)
      - resample 1m → 1m; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  binance_spot_ohlcv/5m:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (every symbol in silver), no features (historical/ohlcv_gold.py)
      - resample 1m → 5m; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  binance_spot_ohlcv/15m:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (every symbol in silver), no features (historical/ohlcv_gold.py)
      - resample 1m → 15m; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  binance_spot_ohlcv/1h:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (every symbol in silver), no features (historical/ohlcv_gold.py)
      - resample 1m → 1h; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  binance_spot_ohlcv/4h:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (every symbol in silver), no features (historical/ohlcv_gold.py)
      - resample 1m → 4h; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  binance_spot_ohlcv/1d:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - plain OHLCV for alpha-quant (every symbol in silver), no features (historical/ohlcv_gold.py)
      - resample 1m → 1d; only windows fully covered by silver, last bar rebuilt each run
      - daily bars are UTC days; never vacuumed (alpha-quant pins Delta versions)

  top_10_momentum_crypto/5m:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - resample 1m → 5m OHLCV (group_by_dynamic)
      - per-symbol pipeline — 10 Binance spot majors
      - Oryon features on close — SMA20, EMA20

  eth_data/1h:
    from: [silver/binance_spot_ohlcv, silver/eth_gas]
    transforms:
      - filter symbol = ETHUSDT
      - resample 1m → 1h OHLCV
      - as-of backward join silver/eth_gas onto each bar (gas_open/high/low/close)
      - Oryon features on close — SMA20, EMA20

  ml_based_strategy/5m:
    from: [silver/binance_spot_ohlcv]
    transforms:
      - filter symbol = BTCUSDT
      - resample 1m → 5m OHLCV
      - features = last 5 5m close-to-close returns (stateful predictor, warmed by rebuild_from_silver)
      - ml_signal = LogisticRegression.predict_proba (model.pkl trained in train.ipynb)
      - ws variant broadcasts each new gold bar; consumer.py subscribes and prints what an executor would do

  macro/1h:
    from: [silver/macro_ohlcv, silver/fred]
    transforms:
      - filter symbol in (EURUSD, GBPUSD)
      - resample 1m → 1h OHLCV (volume intentionally absent)
      - as-of backward join T10Y2Y from silver/fred + age_hours feature
      - Oryon features — SMA20/EMA20 on close, ShannonEntropy(50) + Skewness(50) on T10Y2Y

  wheat_stress/1d:
    from: [silver/crop_weather, silver/usda_nass_planted, silver/macro_ohlcv]
    transforms:
      - primary frame = silver/macro_ohlcv WHEAT resampled 1m → 1d OHLCV
      - transform_gold joins stress_index (weighted mean of per-state stress) onto each bar
      - weights use join_asof on NASS release timestamps — vintage-safe, no look-ahead
      - Oryon features — SMA20/EMA20 on close, SMA30 on stress_index
      - "live runner: Capital poll 1m (bronze + silver + build_live_bar) + Open-Meteo poll 1h (bronze + silver/crop_weather rebuild)"

  cot_positioning/1w:
    from: [silver/cftc_cot]
    transforms:
      - full rebuild from silver each run, one overwrite partitioned by symbol
      - week-over-week changes nc_long_chg / nc_short_chg / nc_net_chg
      - z26 / z52 + pct_rank_26 / pct_rank_52 of nc_net vs PRIOR weeks only (min 10)
      - category (FX / Crypto / Index / Rates / Commodity) from applications/symbols.py
      - keeps the Friday-release timestamp — as-of joins onto price bars stay look-ahead free
      - "UI: applications/cot_desk (Flask, local) — pairs, matrices, top-3, Claude review"

# Reference tables: no time series, no partitions, one row per key.
# Not shown in the dashboard graph (it only draws bronze/silver/gold).
reference:
  instruments:
    source: manual
    grain: one row per instrument
    key: symbol
    partition: none
    notes: |
      Market specs (tick_size, multiplier, qty_step, min_qty, exchange
      calendar + daily break) and the pointer to the bars: gold/<gold_table>
      rows with symbol = data_symbol. Read-only contract with alpha-quant
      (QuantlakeInstrumentSource): do not rename columns or change types.
      Written by reference.instruments.upsert_instruments (merge on symbol);
      initial rows from seed_default(). Costs stay in alpha-quant.

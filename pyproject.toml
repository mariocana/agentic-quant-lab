[tool.poetry]
name = "quantlake"
version = "0.1.0"
description = "Professional trading database: bronze/silver/gold medallion architecture"
readme = "README.md"
packages = [{include = "quantlake", from = "src"}]

[tool.poetry.dependencies]
python = "~3.13"

# Data manipulation + storage
polars = "^1.20"
deltalake = "^0.25"
pyarrow = "^24.0.0"

# HTTP & async ingestion (bronze connectors)
httpx = "^0.27"
websockets = "^13.0"
dune-client = "^1.10.0"

# Feature pipeline
oryon = "^0.2"

# Credentials
python-dotenv = "^1.0"

# The groups below are still installed by a plain `poetry install`; skip the ones you
# don't need, e.g. `poetry install --without geo,research`.

# FastAPI dashboard (`poetry run dashboard`)
[tool.poetry.group.dashboard.dependencies]
fastapi = "^0.136.0"
uvicorn = {extras = ["standard"], version = "^0.45.0"}
duckdb = "^1.2"

# Satellite connectors (sentinel2_ndvi_rest, cdl_rest) + satelite_exercise notebooks
[tool.poetry.group.geo.dependencies]
pystac-client = "^0.9.0"
planetary-computer = "^1.0.0"
odc-stac = "^0.5.2"
rioxarray = "^0.22.0"
scipy = "^1.14"

# Notebooks and ml_based_strategy (model.pkl needs scikit-learn to load)
[tool.poetry.group.research.dependencies]
pandas = "^3.0.2"
matplotlib = "^3.10.9"
scikit-learn = "^1.5"

# applications/cot_desk
[tool.poetry.group.desk.dependencies]
flask = "^3.1"
anthropic = "^1.11"

[tool.poetry.scripts]
dashboard = "quantlake.dashboard.cli:main"

[tool.poetry.group.dev.dependencies]
jupyter = "^1.1"
ipykernel = "^6.29"
pytest = "^8.3"
pytest-asyncio = "^0.24"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

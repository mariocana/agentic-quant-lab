<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ ticker }} · {{ name }} · COT History</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
  // Chart.js in the quantlake dashboard type and palette
  Chart.defaults.font.family = "'JetBrains Mono', Menlo, ui-monospace, monospace";
  Chart.defaults.color = '#71717a';
</script>
<style>
  /* Palette and type from the quantlake dashboard (dashboard/tailwind.config.js) */
  :root {
    --bg: #0a0a0b; --panel: #111113; --panel-2: #16161a;
    --line: #1f1f23; --line-strong: #2a2a30;
    --ink: #e4e4e7; --dim: #71717a; --dim-2: #52525b;
    --accent: #f59e0b; --accent-hover: #fbbf24;
    --green: #22c55e; --red: #f87171; --blue: #06b6d4;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', Menlo, ui-monospace, monospace;
    --radius: 4px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: rgba(245,158,11,0.3); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    font-size: 12px;
    min-height: 100vh; padding: 0 0 48px;
  }
  header {
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    padding: 14px 24px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px;
  }
  .back {
    color: var(--dim); text-decoration: none; font-family: var(--mono); font-size: 11px;
    padding: 5px 10px; border: 1px solid var(--line); border-radius: var(--radius);
    transition: all 0.15s;
  }
  .back:hover { border-color: var(--accent); color: var(--accent); }
  h1 { font-family: var(--mono); font-weight: 600; font-size: 14px; }
  h1 .ticker { color: var(--accent); }
  .sub { font-family: var(--mono); font-size: 10px; color: var(--dim-2); margin-top: 5px; }

  main { max-width: 1400px; margin: 24px auto; padding: 0 24px; }

  .range-btns { display: flex; gap: 4px; margin-bottom: 12px; }
  .range-btn {
    background: transparent; border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--dim); padding: 4px 12px;
    font-family: var(--mono); font-size: 11px;
    cursor: pointer; transition: all 0.15s;
  }
  .range-btn:hover { color: var(--accent); border-color: var(--accent); }
  .range-btn.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }

  .chart-card {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px;
  }
  .chart-wrap { position: relative; height: 480px; margin-bottom: 16px; }
  .oi-wrap { position: relative; height: 120px; }

  .stats {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
    gap: 12px; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 12px;
  }
  .stat { display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
  .stat .lbl {
    color: var(--dim-2); font-family: var(--sans); font-size: 10px;
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  .stat .val { color: var(--ink); font-weight: 500; font-size: 13px; }
  .pos { color: var(--green); } .neg { color: var(--red); }

  .loading { text-align: center; padding: 80px; color: var(--dim-2); font-family: var(--mono); font-size: 11px; }
  .error-box {
    padding: 14px 16px; background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.5); border-radius: var(--radius);
    color: var(--red); font-family: var(--mono); font-size: 12px;
  }
  footer {
    text-align: center; color: var(--dim-2); font-family: var(--mono); font-size: 10px;
    padding: 24px; margin-top: 40px; border-top: 1px solid var(--line);
  }
</style>
</head>
<body>
<header>
  <div>
    <h1><span class="ticker">{{ ticker }}</span> · {{ name }}</h1>
    <div class="sub" id="sub">{{ category }} · Loading history...</div>
  </div>
  <a class="back" href="/">← Back to desk</a>
</header>

<main>
  <div id="loadingBox" class="loading">Loading historical data...</div>
  <div id="chartContainer" style="display:none;">
    <div class="range-btns">
      <button class="range-btn" data-range="3M">3M</button>
      <button class="range-btn active" data-range="1Y">1Y</button>
      <button class="range-btn" data-range="2Y">2Y</button>
    </div>

    <div class="chart-card">
      <div class="chart-wrap"><canvas id="chartNet"></canvas></div>
      <div class="oi-wrap"><canvas id="chartOI"></canvas></div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</main>

<footer>
  Source: official CFTC Public Reporting API (Legacy Futures Only).
  Net = Non-Commercial Long − Non-Commercial Short.
</footer>

<script>
const TICKER = "{{ ticker }}";
const $ = sel => document.querySelector(sel);
const $$ = sel => document.querySelectorAll(sel);
let history = null;
let chartNet = null, chartOI = null;
let currentRange = '1Y';

function fmt(n) { return n == null ? '—' : n.toLocaleString('en-US'); }
function signed(n) { return n == null ? '—' : (n > 0 ? '+' : '') + n.toLocaleString('en-US'); }
function cls(n) { return n > 0 ? 'pos' : (n < 0 ? 'neg' : ''); }

async function load() {
  try {
    const r = await fetch('/api/history/' + TICKER);
    const d = await r.json();
    if (!d.ok) {
      $('#loadingBox').innerHTML = '<div class="error-box">⚠ ' + (d.error || 'Failed to load') + '</div>';
      return;
    }
    history = d;
    $('#sub').textContent = `${d.category} · ${d.n_weeks} weekly reports · ${d.oldest} → ${d.newest}`;
    $('#loadingBox').style.display = 'none';
    $('#chartContainer').style.display = 'block';
    drawCharts(currentRange);
    renderStats();
  } catch (e) {
    $('#loadingBox').innerHTML = '<div class="error-box">⚠ Network error: ' + e.message + '</div>';
  }
}

$$('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    $$('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRange = btn.dataset.range;
    if (history) drawCharts(currentRange);
  });
});

function filterByRange(series, range) {
  if (range === '2Y' || !range) return series;
  const last = new Date(series[series.length - 1].date);
  const cutoff = new Date(last);
  if (range === '3M') cutoff.setMonth(cutoff.getMonth() - 3);
  else if (range === '1Y') cutoff.setFullYear(cutoff.getFullYear() - 1);
  return series.filter(p => new Date(p.date) >= cutoff);
}

function drawCharts(range) {
  const data = filterByRange(history.series, range);
  const labels = data.map(p => p.date);
  const nets = data.map(p => p.net);
  const ois = data.map(p => p.open_interest);

  if (chartNet) chartNet.destroy();
  if (chartOI) chartOI.destroy();

  chartNet = new Chart(document.getElementById('chartNet').getContext('2d'), {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Non-Commercial Net',
        data: nets,
        stepped: true,
        segment: { borderColor: ctx => (ctx.p1.parsed.y >= 0 ? '#22c55e' : '#f87171') },
        borderColor: '#22c55e',
        backgroundColor: ctx => {
          const chart = ctx.chart;
          const {ctx: c, chartArea} = chart;
          if (!chartArea) return null;
          const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
          g.addColorStop(0, 'rgba(34,197,94,0.35)');
          g.addColorStop(0.5, 'rgba(34,197,94,0.05)');
          g.addColorStop(0.5, 'rgba(248,113,113,0.05)');
          g.addColorStop(1, 'rgba(248,113,113,0.35)');
          return g;
        },
        fill: { target: { value: 0 } },
        borderWidth: 2.5,
        pointRadius: 0, pointHoverRadius: 5,
      }],
    },
    options: {
      maintainAspectRatio: false, responsive: true,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#111113', borderColor: '#1f1f23', borderWidth: 1,
          titleColor: '#e4e4e7', bodyColor: '#e4e4e7', padding: 14,
          callbacks: {
            label: (ctx) => {
              const p = data[ctx.dataIndex];
              return [
                `Net: ${p.net >= 0 ? '+' : ''}${p.net.toLocaleString()}`,
                `Long: ${p.nc_long.toLocaleString()}`,
                `Short: ${p.nc_short.toLocaleString()}`,
                `Open Interest: ${p.open_interest.toLocaleString()}`,
              ];
            },
          },
        },
      },
      scales: {
        x: {
          type: 'time',
          time: { unit: range === '3M' ? 'week' : 'month' },
          ticks: { color: '#71717a', font: { size: 11 } },
          grid: { color: 'rgba(42,42,48,0.4)' },
        },
        y: {
          ticks: { color: '#71717a', font: { size: 11 }, callback: v => v.toLocaleString() },
          grid: {
            color: ctx => ctx.tick.value === 0 ? '#71717a' : 'rgba(42,42,48,0.4)',
            lineWidth: ctx => ctx.tick.value === 0 ? 1.5 : 1,
          },
        },
      },
    },
  });

  chartOI = new Chart(document.getElementById('chartOI').getContext('2d'), {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Open Interest',
        data: ois,
        backgroundColor: 'rgba(113,113,122,0.4)',
        borderWidth: 0,
        barThickness: range === '3M' ? 8 : 3,
      }],
    },
    options: {
      maintainAspectRatio: false, responsive: true,
      interaction: { intersect: false, mode: 'index' },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#111113', borderColor: '#1f1f23', borderWidth: 1, padding: 10,
          callbacks: {
            title: () => 'Open Interest',
            label: ctx => ctx.parsed.y.toLocaleString(),
          },
        },
      },
      scales: {
        x: { type: 'time', display: false },
        y: {
          ticks: {
            color: '#71717a', font: { size: 10 },
            callback: v => (v / 1000).toFixed(0) + 'k',
          },
          grid: { color: 'rgba(42,42,48,0.4)' },
        },
      },
    },
  });
}

function renderStats() {
  const s = history.series;
  const last = s[s.length - 1];
  const max = Math.max(...s.map(p => p.net));
  const min = Math.min(...s.map(p => p.net));
  const maxIdx = s.findIndex(p => p.net === max);
  const minIdx = s.findIndex(p => p.net === min);
  $('#stats').innerHTML = `
    <div class="stat"><span class="lbl">Latest report</span><span class="val">${last.date}</span></div>
    <div class="stat"><span class="lbl">Latest net</span><span class="val ${cls(last.net)}">${signed(last.net)}</span></div>
    <div class="stat"><span class="lbl">Latest long</span><span class="val">${fmt(last.nc_long)}</span></div>
    <div class="stat"><span class="lbl">Latest short</span><span class="val">${fmt(last.nc_short)}</span></div>
    <div class="stat"><span class="lbl">Open interest</span><span class="val">${fmt(last.open_interest)}</span></div>
    <div class="stat"><span class="lbl">2Y high (net)</span><span class="val pos">${signed(max)}</span><span class="lbl">on ${s[maxIdx].date}</span></div>
    <div class="stat"><span class="lbl">2Y low (net)</span><span class="val neg">${signed(min)}</span><span class="lbl">on ${s[minIdx].date}</span></div>
    <div class="stat"><span class="lbl">2Y range</span><span class="val">${fmt(max - min)}</span></div>
  `;
}

load();
</script>
</body>
</html>

# Costi di trading per strumento, separati dalle specifiche di mercato
# (tick, moltiplicatore, orari) che arrivano da quantlake (reference/instruments).
#
# fee: per_contract -> per_side = costo per contratto per lato, in valuta di quotazione
# fee: percent      -> maker / taker = frazione del nozionale (0.001 = 0,10%)
# slippage_ticks    -> slippage di default sugli ordini a mercato, in tick
# verified: false   -> valore prudente da sostituire con quello reale del tuo broker/exchange
#
# Si sceglie il profilo con load_costs(profile="..."); si possono aggiungere profili
# (es. "pessimistic") per vedere quanto la strategia regge a costi più alti.

profiles:
  default:
    ES:      {fee: per_contract, per_side: 2.50, slippage_ticks: 1, verified: false}
    NQ:      {fee: per_contract, per_side: 2.50, slippage_ticks: 1, verified: false}
    BTCUSDT: {fee: percent, maker: 0.001, taker: 0.001, slippage_ticks: 1, verified: false}
    ETHUSDT: {fee: percent, maker: 0.001, taker: 0.001, slippage_ticks: 1, verified: false}
    # USDⓈ-M perpetual, livello base VIP 0 (0,02% maker, 0,05% taker); il funding non è un costo
    # di commissione e arriva come evento da quantlake (silver/binance_um_funding)
    BTCUSDT-PERP: {fee: percent, maker: 0.0002, taker: 0.0005, slippage_ticks: 1, verified: false}

# Costi per venue: per i mercati con centinaia di strumenti sotto un solo listino.
# fee_verified / slippage_verified separati: la fee e una regola del listino, lo
# slippage dipende dal book, e quello misurato su testnet (book sottili, mid della
# venue fino al 2,6% lontano dal feed) e prudente per i nomi liquidi di mainnet.
venues:
  hyperliquid:
    fee: percent
    maker: 0.00015
    taker: 0.00045
    slippage_bps: {maker: 0.0, taker: 7.3}
    fee_verified: true
    slippage_verified: false
    source: "126 fill reali del desk su testnet, 07-15/10/2026: maker 78 a 1,5 bps, taker 48 a 4,5 bps, slippage taker media 7,3 / mediana 5,5 / p90 15,7 bps (alphaquant.calibration.desk_fills)"
  hyperliquid_hip3:
    fee: percent
    maker: 0.0003
    taker: 0.0009
    slippage_bps: {maker: 0.0, taker: 15.0}
    fee_verified: false
    slippage_verified: false
    source: "nessun fill reale: fee doppie del listino base come ipotesi prudente, slippage taker doppio per book piu sottili"

# Segmenti di storia per le strategie su Hyperliquid. Fissati il 09/11/2026, prima
# di guardare qualunque risultato sul periodo di holdout con i dati completi.
#
# train       si esplora, si sbaglia, si riprova: nessun conteggio statistico
# validation  ogni spec giudicata qui entra nel conteggio k delle prove
# holdout     chiuso dal codice: HistoricalMarket rifiuta di servire queste date
#             finche la spec non e registrata e il registro non ha aperto il suo
#             holdout. Una volta sola per spec.
# Dopo la fine dell'holdout c'e solo il futuro: lo shadow mode del desk.
#
# Inizio: 12/05/2023, primo funding orario nella storia di Hyperliquid.
hyperliquid:
  train:      ["2023-06-01", "2025-03-31"]
  validation: ["2025-04-01", "2025-12-31"]
  holdout:    ["2026-01-01", "2026-10-31"]

[tool.poetry]
name = "alphaquant"
version = "0.1.0"
description = "Backtest and strategy validation engine reading data from quantlake"
readme = "README.md"
packages = [{include = "alphaquant", from = "src"}]

[tool.poetry.dependencies]
python = "~3.13"

polars = ">=1.44,<2"
deltalake = ">=1.6,<2"
pyarrow = "^24.0.0"
pyyaml = "^6.0"
exchange-calendars = "^4.6"
numpy = ">=2.0"
ai-desk = {path = "../ai-desk", develop = true}
time-machine = ">=2.15"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
